services:
  - type: web
    name: mahiya-edge
    runtime: node
    buildCommand: ./build.sh
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CLINIC_PIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_ENCRYPTION_KEY
        sync: false
      - key: WHISPER_MODEL
        value: small
      - key: OLLAMA_MODEL
        value: gemma3n
